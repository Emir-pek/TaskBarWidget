<title>Taskbar Kedileri — Önizleme</title>
<style>
:root{--bg:#eef1f6;--fg:#1a1d23;--card:#fff;--line:#d6dce6;--acc:#2352c9}
:root:not([data-theme=light]){}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171c;--fg:#e6e9ef;--card:#1c2027;--line:#2c323b;--acc:#6f9bff}}
:root[data-theme=dark]{--bg:#14171c;--fg:#e6e9ef;--card:#1c2027;--line:#2c323b;--acc:#6f9bff}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.55 ui-sans-serif,system-ui,'Segoe UI',sans-serif;margin:0;padding:28px 20px 60px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 24px;opacity:.7;font-size:14px}
.desk{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;
 background:linear-gradient(160deg,#3c4a63,#22293a);height:300px}
.tb{position:absolute;left:0;right:0;bottom:0;height:44px;background:rgba(18,20,26,.92);
 border-top:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:10px;padding:0 12px}
.ic{width:22px;height:22px;border-radius:5px;background:rgba(255,255,255,.16)}
.clock{margin-left:auto;color:#cfd6e2;font-size:12px;font-variant-numeric:tabular-nums}
#cv{position:absolute;bottom:44px;left:0;image-rendering:pixelated}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 0}
button{font:inherit;font-size:13px;padding:7px 13px;border-radius:7px;border:1px solid var(--line);
 background:var(--card);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.lab{font-size:12px;opacity:.65;margin-right:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:14px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.cell canvas{image-rendering:pixelated;display:block;margin:0 auto 6px}
.cell span{font-size:11px;opacity:.6;font-family:ui-monospace,monospace}
h2{font-size:15px;margin:34px 0 6px}
</style>
<div class="wrap">
<h1>Taskbar Kedileri — animasyon önizlemesi</h1>
<p class="sub">Aşağıdaki şerit sahte bir masaüstü. Gerçekte pencere saydam olacak ve taskbar'ın hemen üzerinde duracak.</p>
<div class="desk">
  <div class="tb"><div class="ic"></div><div class="ic"></div><div class="ic"></div><div class="clock">14:32</div></div>
  <canvas id="cv"></canvas>
</div>
<div class="bar">
  <span class="lab">Sahne:</span>
  <button data-s="parade">Kortej</button><button data-s="play">Oyuncak</button>
  <button data-s="pet">Sevme</button><button data-s="nap">Uyku</button>
  <span class="lab" style="margin-left:14px">Boyut:</span>
  <button data-z="1">1x (gerçek)</button><button data-z="2">2x</button><button data-z="3" class="on">3x</button><button data-z="4">4x</button>
  <span class="lab" style="margin-left:14px">Hız:</span>
  <button data-r="1" class="on">Normal</button><button data-r="2">2x hızlı</button>
</div>
<h2>Karakterler</h2>
<div class="grid" id="chars"></div>
<h2>Tüm kareler</h2>
<div class="grid" id="all"></div>
</div>

 4, "oy": 12}, "tarcin_sit_blink": {"x": 102, "y": 132, "w": 34, "h": 33, "sw": 24, "sh": 21, "ox": 5, "oy": 12}, "tarcin_sit_happy": {"x": 136, "y": 132, "w": 34, "h": 33, "sw": 25, "sh": 21, "ox": 4, "oy": 12}, "tarcin_sleep_a": {"x": 170, "y": 132, "w": 34, "h": 33, "sw": 30, "sh": 15, "ox": 2, "oy": 18}, "tarcin_sleep_b": {"x": 204, "y": 132, "w": 34, "h": 33, "sw": 30, "sh": 15, "ox": 2, "oy": 18}, "tarcin_stand": {"x": 238, "y": 132, "w": 34, "h": 33, "sw": 24, "sh": 16, "ox": 5, "oy": 17}, "tarcin_stretch": {"x": 272, "y": 132, "w": 34, "h": 33, "sw": 26, "sh": 14, "ox": 4, "oy": 19}, "tarcin_walk_1": {"x": 306, "y": 132, "w": 34, "h": 33, "sw": 24, "sh": 16, "ox": 5, "oy": 17}, "tarcin_walk_2": {"x": 0, "y": 165, "w": 34, "h": 33, "sw": 24, "sh": 16, "ox": 5, "oy": 17}, "tarcin_walk_3": {"x": 34, "y": 165, "w": 34, "h": 33, "sw": 24, "sh": 16, "ox": 5, "oy": 17}, "tarcin_walk_4": {"x": 68, "y": 165, "w": 34, "h": 33, "sw": 24, "sh": 16, "ox": 5, "oy": 17}, "tarcin_yawn": {"x": 102, "y": 165, "w": 34, "h": 33, "sw": 30, "sh": 15, "ox": 2, "oy": 18}, "zilli_jump_1": {"x": 136, "y": 165, "w": 34, "h": 33, "sw": 24, "sh": 15, "ox": 5, "oy": 18}, "zilli_jump_2": {"x": 170, "y": 165, "w": 34, "h": 33, "sw": 24, "sh": 15, "ox": 5, "oy": 18}, "zilli_jump_3": {"x": 204, "y": 165, "w": 34, "h": 33, "sw": 25, "sh": 15, "ox": 4, "oy": 18}, "zilli_lookup": {"x": 238, "y": 165, "w": 34, "h": 33, "sw": 26, "sh": 20, "ox": 4, "oy": 13}, "zilli_rub_a": {"x": 272, "y": 165, "w": 34, "h": 33, "sw": 27, "sh": 21, "ox": 3, "oy": 12}, "zilli_rub_b": {"x": 306, "y": 165, "w": 34, "h": 33, "sw": 26, "sh": 20, "ox": 4, "oy": 13}, "zilli_sit_a": {"x": 0, "y": 198, "w": 34, "h": 33, "sw": 26, "sh": 21, "ox": 4, "oy": 12}, "zilli_sit_b": {"x": 34, "y": 198, "w": 34, "h": 33, "sw": 27, "sh": 21, "ox": 3, "oy": 12}, "zilli_sit_blink": {"x": 68, "y": 198, "w": 34, "h": 33, "sw": 26, "sh": 21, "ox": 4, "oy": 12}, "zilli_sit_happy": {"x": 102, "y": 198, "w": 34, "h": 33, "sw": 27, "sh": 21, "ox": 3, "oy": 12}, "zilli_sleep_a": {"x": 136, "y": 198, "w": 34, "h": 33, "sw": 30, "sh": 15, "ox": 2, "oy": 18}, "zilli_sleep_b": {"x": 170, "y": 198, "w": 34, "h": 33, "sw": 30, "sh": 15, "ox": 2, "oy": 18}, "zilli_stand": {"x": 204, "y": 198, "w": 34, "h": 33, "sw": 24, "sh": 16, "ox": 5, "oy": 17}, "zilli_stretch": {"x": 238, "y": 198, "w": 34, "h": 33, "sw": 26, "sh": 14, "ox": 4, "oy": 19}, "zilli_walk_1": {"x": 272, "y": 198, "w": 34, "h": 33, "sw": 24, "sh": 16, "ox": 5, "oy": 17}, "zilli_walk_2": {"x": 306, "y": 198, "w": 34, "h": 33, "sw": 24, "sh": 16, "ox": 5, "oy": 17}, "zilli_walk_3": {"x": 0, "y": 231, "w": 34, "h": 33, "sw": 24, "sh": 16, "ox": 5, "oy": 17}, "zilli_walk_4": {"x": 34, "y": 231, "w": 34, "h": 33, "sw": 24, "sh": 16, "ox": 5, "oy": 17}, "zilli_yawn": {"x": 68, "y": 231, "w": 34, "h": 33, "sw": 30, "sh": 15, "ox": 2, "oy": 18}}};
const SHEET = new Image();
// ---- ORTAK SAHNE MOTORU (PowerShell'e birebir portlanacak) ----
const CW = 30, CH = 33;          // sprite hucre olcusu
const STAGE_W = 200;             // pencere ic genisligi
const TICK = 80;                 // ms

const CATS = ["tarcin", "maya", "zilli"];

// anim: [kare adlari], her karenin kac tick surecegi
const ANIM = {
  walk:   { f: ["walk_1","walk_2","walk_3","walk_4"], hold: 2 },
  stand:  { f: ["stand"], hold: 8 },
  sit:    { f: ["sit_a","sit_a","sit_a","sit_blink"], hold: 8 },
  sitwag: { f: ["sit_a","sit_b"], hold: 6 },
  lookup: { f: ["lookup","lookup","lookup","sit_blink"], hold: 8 },
  jump:   { f: ["jump_1","jump_2","jump_3","jump_2","jump_1"], hold: 2 },
  sleep:  { f: ["sleep_a","sleep_b"], hold: 14, bob: [0,-1] },
  yawn:   { f: ["sleep_a","yawn","yawn","stretch","stretch","sleep_a"], hold: 5 },
  rub:    { f: ["rub_a","rub_b"], hold: 5 },
  happy:  { f: ["sit_happy","sit_b"], hold: 5 },
};
const HANIM = {
  hwalk:  { f: ["human_walk_1","human_walk_2","human_walk_3","human_walk_4"], hold: 3 },
  hstand: { f: ["human_stand"], hold: 10 },
  hwave:  { f: ["human_wave_1","human_wave_2","human_wave_3","human_wave_2"], hold: 3 },
  hpet:   { f: ["human_crouch_1","human_crouch_2"], hold: 6 },
};

// sahne tanimlari: her aktor icin hedef x ve anim
const SCENES = {
  parade: { dur: [180, 300], move: 2,
            human: { x: 150, a: "hwalk" },
            cats:  [{ x: 108, a: "walk" }, { x: 68, a: "walk" }, { x: 28, a: "walk" }] },
  play:   { dur: [200, 320], move: 0, flipHuman: true,
            human: { x: 152, a: "hwave" },
            cats:  [{ x: 112, a: "jump" }, { x: 74, a: "lookup" }, { x: 34, a: "sit" }] },
  pet:    { dur: [200, 320], move: 0, flipHuman: true,
            human: { x: 146, a: "hpet" },
            cats:  [{ x: 116, a: "rub" }, { x: 76, a: "happy" }, { x: 36, a: "sitwag" }] },
  nap:    { dur: [250, 400], move: 0,
            human: { x: 150, a: "hstand" },
            cats:  [{ x: 104, a: "sleep" }, { x: 66, a: "yawn" }, { x: 26, a: "sleep" }] },
};
const ORDER = ["parade", "play", "pet", "nap"];

function makeState(screenW) {
  return {
    scene: "parade", t: 0, dur: 200, phase: "run",
    groupX: Math.floor(screenW / 2 - STAGE_W / 2), dir: 1, screenW,
    actors: [
      { name: "human", x: 150, tx: 150, anim: "hwalk", fi: 0, fh: 0, flip: false, y: 0 },
      { name: "tarcin", x: 108, tx: 108, anim: "walk", fi: 0, fh: 0, flip: false, y: 0 },
      { name: "maya",  x: 68,  tx: 68,  anim: "walk", fi: 0, fh: 0, flip: false, y: 0 },
      { name: "zilli",  x: 28,  tx: 28,  anim: "walk", fi: 0, fh: 0, flip: false, y: 0 },
    ],
    fx: [],   // {kind,x,y,life}
  };
}

function applyScene(st, name) {
  const s = SCENES[name];
  st.scene = name; st.t = 0; st.phase = "move";
  st.dur = s.dur[0] + Math.floor(Math.random() * (s.dur[1] - s.dur[0]));
  st.actors[0].tx = s.human.x; st.actors[0].nextAnim = s.human.a;
  st.actors[0].nextFlip = !!s.flipHuman;
  const perm = [0, 1, 2].sort(() => Math.random() - 0.5);   // roller karisir
  for (let i = 0; i < 3; i++) {
    const slot = perm[i];
    st.actors[i + 1].tx = s.cats[slot].x;
    st.actors[i + 1].nextAnim = s.cats[slot].a;
    st.actors[i + 1].nextFlip = false;
  }
}

function frameName(a) {
  const set = a.name === "human" ? HANIM[a.anim] : ANIM[a.anim];
  const f = set.f[a.fi % set.f.length];
  return a.name === "human" ? f : a.name + "_" + f;
}

function step(st) {
  st.t++;
  const s = SCENES[st.scene];

  // --- gecis: aktorler hedef pozisyona yurur ---
  if (st.phase === "move") {
    let moving = false;
    for (const a of st.actors) {
      const d = a.tx - a.x;
      if (Math.abs(d) > 1.5) {
        a.x += Math.sign(d) * 2; a.flip = d < 0;
        a.anim = a.name === "human" ? "hwalk" : "walk";
        moving = true;
      } else {
        a.x = a.tx;
        a.anim = a.nextAnim; a.flip = a.nextFlip;
      }
    }
    if (!moving) { st.phase = "run"; st.t = 0; }
  } else {
    // --- sahne calisiyor ---
    if (s.move) {
      st.groupX += s.move * st.dir;
      if (st.groupX < 8) { st.groupX = 8; st.dir = 1; flipAll(st, false); }
      if (st.groupX > st.screenW - STAGE_W - 8) {
        st.groupX = st.screenW - STAGE_W - 8; st.dir = -1; flipAll(st, true);
      }
    }
    if (st.t > st.dur) {
      const others = ORDER.filter(n => n !== st.scene);
      applyScene(st, others[Math.floor(Math.random() * others.length)]);
    }
  }

  // --- kare ilerlet ---
  for (const a of st.actors) {
    const set = a.name === "human" ? HANIM[a.anim] : ANIM[a.anim];
    a.fh++;
    if (a.fh >= set.hold) { a.fh = 0; a.fi = (a.fi + 1) % set.f.length; }
    // ziplama yuksekligi
    if (a.anim === "jump") {
      const f = set.f[a.fi];
      a.y = (f === "jump_2") ? -5 : (f === "jump_3" ? -3 : 0);
    } else if (set.bob) {
      a.y = set.bob[a.fi % set.bob.length];
    } else a.y = 0;
  }

  // --- efektler ---
  if (st.phase === "run") {
    if (st.scene === "pet" && st.t % 22 === 0) {
      const p = st.actors.find(a => a.anim === "rub") || st.actors[1];
      st.fx.push({ kind: Math.random() < .5 ? "fx_heart" : "fx_heart_s", x: p.x + 4, y: -4, life: 26 });
    }
    if (st.scene === "nap" && st.t % 16 === 0) {
      const sl = st.actors.filter(a => a.anim === "sleep");
      const p = sl.length ? sl[Math.floor(Math.random() * sl.length)] : st.actors[1];
      st.fx.push({ kind: "zzz", x: p.x + 8, y: -2, life: 30 });
    }
    if (st.scene === "play" && st.t % 30 === 0)
      st.fx.push({ kind: "fx_spark", x: st.actors[0].x - 12, y: -14, life: 12 });
  }
  st.fx = st.fx.filter(f => { f.life--; f.y -= 0.5; return f.life > 0; });
}

function flipAll(st, v) { for (const a of st.actors) a.flip = v; }

let ZOOM = 3, RATE = 1;
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
let st;

function draw(ctx, name, px, py, flip, z){
  const f = META.frames[name]; if(!f) return;
  ctx.save();
  if(flip){ ctx.translate((px+f.w*z), py); ctx.scale(-1,1); }
  else ctx.translate(px, py);
  ctx.drawImage(SHEET, f.x, f.y, f.w, f.h, 0, 0, f.w*z, f.h*z);
  ctx.restore();
}

function render(){
  const z = ZOOM;
  cv.width = st.screenW*z; cv.height = (CH+12)*z;
  cv.style.width = (st.screenW*z)+'px'; cv.style.height = ((CH+12)*z)+'px';
  cx.imageSmoothingEnabled = false;
  cx.clearRect(0,0,cv.width,cv.height);
  const base = 12;
  for(const a of st.actors)
    draw(cx, frameName(a), (st.groupX + a.x)*z, (base + a.y)*z, a.flip, z);
  for(const f of st.fx){
    const n = f.kind==='zzz' ? ('fx_zzz_'+Math.max(1,Math.min(3,3-Math.floor((30-f.life)/10)))) : f.kind;
    draw(cx, n, (st.groupX + f.x)*z, (base + f.y - 14)*z, false, z);
  }
}

function loop(){ for(let i=0;i<RATE;i++) step(st); render(); }

SHEET.onload = ()=>{
  const deskW = document.querySelector('.desk').clientWidth;
  st = makeState(Math.floor(deskW/ZOOM));
  setInterval(loop, TICK);

document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-s]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); applyScene(st, b.dataset.s);
});
document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-z]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); ZOOM=+b.dataset.z;
  st.screenW = Math.floor(document.querySelector('.desk').clientWidth/ZOOM);
  st.groupX = Math.min(st.groupX, st.screenW-STAGE_W-8);
});
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-r]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); RATE=+b.dataset.r;
});

function miniLoop(el, frames, hold){
  const c = el.getContext('2d'); let i=0, h=0;
  setInterval(()=>{ h++; if(h>=hold){h=0;i=(i+1)%frames.length;}
    c.clearRect(0,0,c.canvas.width,c.canvas.height);
    c.imageSmoothingEnabled=false; draw(c, frames[i], 0,0,false,3); }, TICK);
}
function buildGalleries(){
  const chars = [
    ['tarcin','Tarçın — turuncu-beyaz',['tarcin_walk_1','tarcin_walk_2','tarcin_walk_3','tarcin_walk_4'],2],
    ['maya','Maya — kabarık krem',['maya_walk_1','maya_walk_2','maya_walk_3','maya_walk_4'],2],
    ['zilli','Zilli — gri British',['zilli_walk_1','zilli_walk_2','zilli_walk_3','zilli_walk_4'],2],
    ['human','İnsan',['human_walk_1','human_walk_2','human_walk_3','human_walk_4'],3],
  ];
  const g = document.getElementById('chars');
  for(const [id,label,frames,hold] of chars){
    const d=document.createElement('div'); d.className='cell';
    const c=document.createElement('canvas'); c.width=META.cell_w*3; c.height=META.cell_h*3;
    d.appendChild(c); const s=document.createElement('span'); s.textContent=label; d.appendChild(s);
    g.appendChild(d); miniLoop(c, frames, hold);
  }
  const all=document.getElementById('all');
  for(const n of Object.keys(META.frames).sort()){
    const d=document.createElement('div'); d.className='cell';
    const c=document.createElement('canvas'); c.width=META.cell_w*3; c.height=META.cell_h*3;
    const ctx=c.getContext('2d'); ctx.imageSmoothingEnabled=false; draw(ctx,n,0,0,false,3);
    d.appendChild(c); const s=document.createElement('span'); s.textContent=n; d.appendChild(s);
    all.appendChild(d);
  }
}
</script>
